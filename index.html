<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SNS 멀티 포맷 비디오 생성기 (FB / IS / US)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background: #0f1015; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 460px; background: #181920; padding: 22px; overflow-y: auto; border-right: 1px solid #272832; display: flex; flex-direction: column; gap: 14px; }
    h2 { font-size: 1.18rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.84rem; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 500; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; background: #22232e; border: 1px solid #333547; color: #fff; padding: 9px; border-radius: 6px; font-size: 0.88rem; }
    textarea { resize: vertical; height: 90px; line-height: 1.4; }

    /* 프리뷰 플랫폼 탭 */
    .tab-group { display: flex; gap: 6px; background: #22232e; padding: 4px; border-radius: 8px; border: 1px solid #333547; }
    .tab-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #ff0055; color: #fff; }

    .file-box { border: 2px dashed #3b3e54; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; background: #22232e; }
    .file-box:hover { border-color: #ff0055; }

    /* 썸네일 드래그 앤 드롭 영역 */
    .thumb-container { display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px; min-height: 90px; border: 1px solid #282a38; border-radius: 6px; background: #1a1b24; }
    .thumb-card {
      width: 74px; height: 74px; flex-shrink: 0; border-radius: 6px; overflow: hidden; position: relative;
      background: #000; border: 2px solid #3b3f54; cursor: grab; user-select: none;
    }
    .thumb-card.dragging { opacity: 0.35; border-color: #ff0055; }
    .thumb-card img, .thumb-card video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .thumb-badge { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
    .thumb-del { position: absolute; top: 2px; right: 2px; background: rgba(255,0,0,0.85); color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 0.7rem; line-height: 15px; text-align: center; cursor: pointer; }
    .thumb-type { position: absolute; bottom: 2px; right: 2px; background: #ff0055; color: #fff; font-size: 0.6rem; padding: 1px 3px; border-radius: 2px; font-weight: bold; }

    /* 시간 설정 2열 */
    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 저장 플랫폼 타겟 선택 */
    .target-group { display: flex; gap: 6px; }
    .target-btn { flex: 1; padding: 8px 0; background: #20222c; border: 1px solid #3b3f54; border-radius: 6px; color: #cbd5e1; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; }
    .target-btn.active { background: #38bdf8; color: #000; border-color: #38bdf8; }

    .btn-group { display: flex; gap: 8px; }
    button.action-btn { cursor: pointer; border: none; border-radius: 6px; padding: 11px 14px; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
    .btn-preview { background: #3b82f6; color: #fff; flex: 1; }
    .btn-preview:hover { background: #2563eb; }
    .btn-stop { background: #2d303e; color: #eee; }
    
    .btn-render-all { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; width: 100%; font-size: 0.95rem; padding: 13px; border-radius: 8px; box-shadow: 0 4px 15px rgba(255,0,85,0.3); }
    .btn-render-all:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }

    /* 프리뷰 뷰포트 */
    #preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; background: #08090c; }
    .monitor-container {
      display: flex; align-items: center; justify-content: center; background: #000; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 4px #222430; position: relative; overflow: hidden;
      transition: width 0.3s, height 0.3s;
    }
    
    .view-us { width: 320px; height: 568px; } /* 9:16 유튜브 쇼츠 */
    .view-is { width: 440px; height: 440px; } /* 1:1 인스타그램 피드 */
    .view-fb { width: 360px; height: 450px; } /* 4:5 페이스북 피드 */

    canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
    .status-bar { margin-top: 15px; font-size: 0.88rem; color: #38bdf8; text-align: center; line-height: 1.4; }
    .progress-bar { width: 360px; height: 6px; background: #1e2230; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { width: 0%; height: 100%; background: #ff0055; transition: width 0.1s; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>🎬 SNS 멀티 포맷 생성기</h2>

    <!-- 미리보기 플랫폼 탭 -->
    <div>
      <label>프리뷰 플랫폼 선택</label>
      <div class="tab-group">
        <button class="tab-btn active" id="tab-us" onclick="changeMode('us')">쇼츠 (9:16)</button>
        <button class="tab-btn" id="tab-is" onclick="changeMode('is')">인스타 (1:1)</button>
        <button class="tab-btn" id="tab-fb" onclick="changeMode('fb')">페이스북 (4:5)</button>
      </div>
    </div>

    <div>
      <label>콘텐츠 메인 제목</label>
      <input type="text" id="titleInput" value="이창동 감독 '가능한 사랑'">
    </div>

    <div>
      <label>기사 및 리뷰 글 (자동 분할)</label>
      <textarea id="articleInput">이창동 감독의 신작 '가능한 사랑'은 삶의 균열 속에서 피어나는 사랑의 본질을 묻는다.
치밀한 심리 묘사와 배우들의 강렬한 연기가 숨 막히는 긴장감을 선사한다.
일상의 작은 틈새를 파고드는 날카로운 시선은 깊은 여운을 남긴다.
감독 특유의 리얼리즘과 인간에 대한 깊은 연민이 스크린 가득 펼쳐진다.
질문은 무겁고 울림은 길다. 극장에서 반드시 확인해야 할 올해의 수작이다.</textarea>
    </div>

    <!-- 스틸컷 & 영상 순서 배치 (드래그 앤 드롭) -->
    <div>
      <label>스틸컷 & 영상 (드래그하여 순서 변경)</label>
      <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display: none;">
      <div class="file-box" onclick="document.getElementById('mediaInput').click()">
        + 클릭하여 사진이나 동영상 추가
      </div>
      <div id="thumbList" class="thumb-container" style="margin-top: 6px;"></div>
    </div>

    <!-- 스틸과 동영상 시간 완전 분리 -->
    <div class="time-grid">
      <div>
        <label>스틸 노출 시간 (초)</label>
        <input type="number" id="stillDurationInput" value="3.5" min="1" max="15" step="0.5">
      </div>
      <div>
        <label style="color:#38bdf8; font-weight:bold;">동영상 재생 시간 (초)</label>
        <input type="number" id="videoDurationInput" value="10.0" min="2" max="60" step="1.0">
      </div>
    </div>

    <!-- 배경음악 설정 -->
    <div>
      <label>배경음악 (오디오)</label>
      <select id="bgmModeSelect" onchange="toggleBgmInput()">
        <option value="synth" selected>기본 잔잔한 앰비언트 BGM (자동 연주 / 자동 합성)</option>
        <option value="custom">내 MP3 파일 직접 선택</option>
        <option value="none">무음</option>
      </select>
      <input type="file" id="bgmFileInput" accept="audio/*" style="display:none; margin-top:6px;">
    </div>

    <div class="btn-group">
      <button class="action-btn btn-preview" onclick="startPreview()">▶ 소리 들으며 미리보기</button>
      <button class="action-btn btn-stop" onclick="stopPreview()">■ 정지</button>
    </div>

    <!-- 저장할 플랫폼 선택 (기본: All) -->
    <div>
      <label>저장할 플랫폼 선택</label>
      <div class="target-group">
        <button type="button" class="target-btn active" id="tgt-all" onclick="setExportTarget('all')">All (3종 전체)</button>
        <button type="button" class="target-btn" id="tgt-fb" onclick="setExportTarget('fb')">FB (페이스북)</button>
        <button type="button" class="target-btn" id="tgt-is" onclick="setExportTarget('is')">IS (인스타)</button>
        <button type="button" class="target-btn" id="tgt-us" onclick="setExportTarget('us')">쇼츠 (US)</button>
      </div>
    </div>

    <!-- 저장 버튼: 클릭 즉시 윈도우 폴더 창 호출 -->
    <button id="renderBtn" class="action-btn btn-render-all" onclick="executeRender()">🚀 영상 생성 및 저장 (C:\sns_contents)</button>
  </div>

  <div id="preview-area">
    <div id="monitor" class="monitor-container view-us">
      <canvas id="videoCanvas" width="1080" height="1920"></canvas>
    </div>
    <div class="status-bar" id="statusText">준비 완료. 사진/영상을 넣고 미리보기를 해보세요.</div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <script>
    const PLATFORMS = {
      us: { name: '유튜브쇼츠', prefix: 'us', width: 1080, height: 1920, className: 'view-us' },
      is: { name: '인스타그램', prefix: 'in', width: 1080, height: 1080, className: 'view-is' },
      fb: { name: '페이스북',   prefix: 'fb', width: 1080, height: 1350, className: 'view-fb' }
    };

    let currentMode = 'us';
    let exportTarget = 'all';
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const monitor = document.getElementById('monitor');

    let loadedMedia = [];
    let isPlaying = false;
    let animId = null;
    let rootDirHandle = null;
    let bgmAudioEl = null;

    let previewAudioCtx = null;
    let previewOscillators = [];

    function changeMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${mode}`).classList.add('active');

      monitor.className = `monitor-container ${PLATFORMS[mode].className}`;
      canvas.width = PLATFORMS[mode].width;
      canvas.height = PLATFORMS[mode].height;
      drawFrame(0, 0, currentMode);
    }

    function setExportTarget(target) {
      exportTarget = target;
      document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tgt-${target}`).classList.add('active');

      const renderBtn = document.getElementById('renderBtn');
      if (target === 'all') {
        renderBtn.innerText = '🚀 3종 일괄 생성 및 저장 (날짜시간_fb/in/us)';
      } else {
        renderBtn.innerText = `🚀 ${PLATFORMS[target].name} 생성 및 저장 (날짜시간_${PLATFORMS[target].prefix})`;
      }
    }

    function toggleBgmInput() {
      const mode = document.getElementById('bgmModeSelect').value;
      document.getElementById('bgmFileInput').style.display = (mode === 'custom') ? 'block' : 'none';
    }

    document.getElementById('bgmFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgmAudioEl = new Audio(URL.createObjectURL(file));
    });

    document.getElementById('mediaInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const item = { id: Date.now() + Math.random() };
        if (file.type.startsWith('image/')) {
          const img = new Image();
          img.src = url;
          item.type = 'image';
          item.element = img;
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = url;
          vid.muted = true;
          vid.playsInline = true;
          vid.loop = true;
          item.type = 'video';
          item.element = vid;
        }
        loadedMedia.push(item);
      });
      renderThumbnails();
      setTimeout(() => drawFrame(0, 0, currentMode), 200);
      e.target.value = "";
    });

    function renderThumbnails() {
      const container = document.getElementById('thumbList');
      container.innerHTML = "";
      if (loadedMedia.length === 0) {
        container.innerHTML = `<span style="font-size:0.75rem; color:#64748b; margin:auto;">등록된 미디어 없음 (기본 배경 사용)</span>`;
        return;
      }

      loadedMedia.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.draggable = true;
        card.dataset.index = index;

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.element.src;
          card.appendChild(img);
        } else {
          const vid = document.createElement('video');
          vid.src = item.element.src;
          vid.muted = true;
          card.appendChild(vid);
        }

        const badge = document.createElement('div');
        badge.className = 'thumb-badge';
        badge.innerText = `#${index + 1}`;
        card.appendChild(badge);

        const typeBadge = document.createElement('div');
        typeBadge.className = 'thumb-type';
        typeBadge.innerText = item.type === 'video' ? '동영상' : '스틸';
        card.appendChild(typeBadge);

        const delBtn = document.createElement('div');
        delBtn.className = 'thumb-del';
        delBtn.innerText = '×';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          loadedMedia.splice(index, 1);
          renderThumbnails();
          drawFrame(0, 0, currentMode);
        };
        card.appendChild(delBtn);

        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        container.appendChild(card);
      });
    }

    let dragSrcIndex = null;
    function handleDragStart(e) {
      dragSrcIndex = Number(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    function handleDrop(e) {
      e.preventDefault();
      const dropTargetIndex = Number(this.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== dropTargetIndex) {
        const movedItem = loadedMedia.splice(dragSrcIndex, 1)[0];
        loadedMedia.splice(dropTargetIndex, 0, movedItem);
        renderThumbnails();
        drawFrame(0, 0, currentMode);
      }
    }
    function handleDragEnd() {
      this.classList.remove('dragging');
      dragSrcIndex = null;
    }

    function getScenes() {
      const title = document.getElementById('titleInput').value.trim();
      const rawText = document.getElementById('articleInput').value.trim();
      const sentences = rawText.split(/\n|\.\s+/).map(s => s.trim()).filter(s => s.length > 0);
      const count = Math.max(5, loadedMedia.length || 5);
      
      const stillSec = parseFloat(document.getElementById('stillDurationInput').value) || 3.5;
      const videoSec = parseFloat(document.getElementById('videoDurationInput').value) || 10.0;

      const scenes = [];
      for (let i = 0; i < count; i++) {
        const mediaItem = loadedMedia[i] || null;
        const dur = (mediaItem && mediaItem.type === 'video') ? videoSec : stillSec;

        scenes.push({
          title: title,
          subtitle: `KEY POINT 0${i + 1}`,
          body: sentences[i] ? sentences[i] + (sentences[i].endsWith('.') ? '' : '.') : "",
          media: mediaItem,
          duration: dur
        });
      }
      return scenes;
    }

    // [핵심] 인스타(1:1)/쇼츠(9:16)/페북(4:5) 어떤 포맷이든 머리/팔/다리 절대 안 잘리는 스마트 오토 핏
    function drawSmartAutoFit(ctx, img, w, h, mode) {
      const nw = img.videoWidth || img.naturalWidth || w;
      const nh = img.videoHeight || img.naturalHeight || h;

      // 1) 배경: 화면 전체를 꽉 채우고 어두운 시네마틱 블러 처리 (여백 제로)
      ctx.save();
      ctx.filter = 'blur(40px) brightness(0.38)';
      const rBg = Math.max(w / nw, h / nh);
      ctx.drawImage(img, (w - nw * rBg) / 2, (h - nh * rBg) / 2, nw * rBg, nh * rBg);
      ctx.restore();

      // 2) 전경: 상하단 자막 공간을 제외한 안전 영역(Safe Area) 안에 인물 원본 비율 100% 온전히 보존
      // 인스타(1:1)는 높이가 낮으므로 가용 높이를 66%, 쇼츠/페북은 62%로 정밀 계산
      const safeHeightRatio = (mode === 'is') ? 0.66 : 0.62;
      const maxTargetW = w * 0.96;
      const maxTargetH = h * safeHeightRatio;

      const scale = Math.min(maxTargetW / nw, maxTargetH / nh);
      const targetW = nw * scale;
      const targetH = nh * scale;

      const posX = (w - targetW) / 2;
      // 상단 타이틀 바로 아래, 하단 자막 바로 위에 완벽한 황금 비율 중앙 안착
      const topBoundary = (mode === 'is') ? 140 : 210;
      const posY = topBoundary + (maxTargetH - targetH) / 2;

      ctx.drawImage(img, posX, posY, targetW, targetH);
    }

    function drawFrame(sceneIdx, sceneProgress, mode) {
      const scenes = getScenes();
      const scene = scenes[sceneIdx];
      if (!scene) return;

      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = "#0c0d12";
      ctx.fillRect(0, 0, W, H);

      // 1. 미디어 그리기
      if (scene.media) {
        const el = scene.media.element;
        if (scene.media.type === 'video') {
          const targetTime = sceneProgress * scene.duration;
          if (isPlaying) {
            if (Math.abs(el.currentTime - targetTime) > 0.4) {
              el.currentTime = targetTime;
            }
            if (el.paused) el.play();
          }
        }
        drawSmartAutoFit(ctx, el, W, H, mode);
      }

      // 2. 상하단 시네마틱 섀도우 그라디언트
      const topGradHeight = (mode === 'is') ? H * 0.22 : H * 0.20;
      const topGrad = ctx.createLinearGradient(0, 0, 0, topGradHeight);
      topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.88)');
      topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, W, topGradHeight);

      const botGradStart = (mode === 'is') ? H * 0.72 : H * 0.65;
      const botGrad = ctx.createLinearGradient(0, botGradStart, 0, H);
      botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      botGrad.addColorStop(0.35, 'rgba(0, 0, 0, 0.70)');
      botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, botGradStart, W, H - botGradStart);

      // 3. 상단 제목
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = (mode === 'is') ? 'bold 42px sans-serif' : 'bold 46px sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.95)';
      ctx.shadowBlur = 10;
      
      const topOffset = (mode === 'is') ? 75 : 130;
      ctx.fillText(scene.title, W / 2, topOffset);

      ctx.fillStyle = '#FF3366';
      ctx.font = (mode === 'is') ? 'bold 26px sans-serif' : 'bold 28px sans-serif';
      ctx.fillText(`── ${scene.subtitle} ──`, W / 2, topOffset + 42);

      // 4. 하단 자막
      if (scene.body) {
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = (mode === 'is') ? 'bold 38px sans-serif' : 'bold 42px sans-serif';

        const bottomOffset = (mode === 'is') ? H - 140 : H - 280;
        const lineSpacing = (mode === 'is') ? 52 : 60;
        wrapText(ctx, scene.body, W / 2, bottomOffset, W - 140, lineSpacing);
      }
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      let startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, startY + (i * lineHeight));
      }
    }

    // [BGM] 앰비언트 사운드 엔진
    function buildAmbientTrack(audioContext, totalSec, outputNode) {
      const chordProgression = [
        [220.00, 261.63, 329.63, 440.00], // Am
        [174.61, 220.00, 261.63, 349.23], // F
        [261.63, 329.63, 392.00, 523.25], // C
        [196.00, 246.94, 293.66, 392.00]  // G
      ];

      const masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0.42, audioContext.currentTime);
      masterGain.connect(outputNode);

      let curTime = audioContext.currentTime;
      let step = 0;
      const oscillators = [];

      while (curTime < audioContext.currentTime + totalSec + 4) {
        const chord = chordProgression[step % chordProgression.length];
        chord.forEach((freq, idx) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, curTime);

          gain.gain.setValueAtTime(0.001, curTime);
          gain.gain.linearRampToValueAtTime(0.12, curTime + 0.3);
          gain.gain.linearRampToValueAtTime(0.04, curTime + 2.8);
          gain.gain.linearRampToValueAtTime(0.001, curTime + 3.4);

          osc.connect(gain);
          gain.connect(masterGain);

          osc.start(curTime);
          osc.stop(curTime + 3.5);
          oscillators.push(osc);
        });

        curTime += 3.2;
        step++;
      }
      return oscillators;
    }

    async function startPreview() {
      stopPreview();
      isPlaying = true;
      const scenes = getScenes();
      const totalDuration = scenes.reduce((acc, s) => acc + (s.duration * 1000), 0);
      const totalSec = totalDuration / 1000;

      const bgmMode = document.getElementById('bgmModeSelect').value;
      if (bgmMode === 'synth') {
        previewAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (previewAudioCtx.state === 'suspended') {
          await previewAudioCtx.resume();
        }
        previewOscillators = buildAmbientTrack(previewAudioCtx, totalSec, previewAudioCtx.destination);
      } else if (bgmMode === 'custom' && bgmAudioEl) {
        bgmAudioEl.currentTime = 0;
        bgmAudioEl.play();
      }

      let startTime = performance.now();

      function loop(now) {
        if (!isPlaying) return;
        const elapsed = (now - startTime) % totalDuration;
        
        let accumulated = 0;
        let sceneIdx = 0;
        let sceneProgress = 0;

        for (let i = 0; i < scenes.length; i++) {
          const sceneMs = scenes[i].duration * 1000;
          if (elapsed >= accumulated && elapsed < accumulated + sceneMs) {
            sceneIdx = i;
            sceneProgress = (elapsed - accumulated) / sceneMs;
            break;
          }
          accumulated += sceneMs;
        }

        drawFrame(sceneIdx, sceneProgress, currentMode);

        document.getElementById('progressFill').style.width = ((elapsed / totalDuration) * 100) + '%';
        const curMedia = scenes[sceneIdx].media;
        const typeStr = (curMedia && curMedia.type === 'video') ? '동영상(10s)' : '스틸';
        document.getElementById('statusText').innerText = `[${PLATFORMS[currentMode].name}] BGM 재생 중: 씬 ${sceneIdx + 1}/${scenes.length} (${typeStr})`;

        animId = requestAnimationFrame(loop);
      }
      animId = requestAnimationFrame(loop);
    }

    function stopPreview() {
      isPlaying = false;
      if (animId) cancelAnimationFrame(animId);
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('statusText').innerText = '정지됨';

      if (previewAudioCtx) {
        previewAudioCtx.close();
        previewAudioCtx = null;
      }
      if (bgmAudioEl) bgmAudioEl.pause();

      getScenes().forEach(s => {
        if (s.media && s.media.type === 'video') {
          s.media.element.pause();
          s.media.element.currentTime = 0;
        }
      });
    }

    // 단일 플랫폼 녹화 & C:\sns_contents 에 직접 쓰기
    async function recordSinglePlatform(modeKey, targetFolderHandle, timeStampStr) {
      const config = PLATFORMS[modeKey];
      canvas.width = config.width;
      canvas.height = config.height;
      monitor.className = `monitor-container ${config.className}`;

      const scenes = getScenes();
      const totalDuration = scenes.reduce((acc, s) => acc + (s.duration * 1000), 0);
      const totalSec = totalDuration / 1000;

      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream();
      combinedStream.addTrack(videoStream.getVideoTracks()[0]);

      const bgmMode = document.getElementById('bgmModeSelect').value;
      const aCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (aCtx.state === 'suspended') {
        await aCtx.resume();
      }

      if (bgmMode === 'synth') {
        const dest = aCtx.createMediaStreamDestination();
        buildAmbientTrack(aCtx, totalSec + 2, dest);
        combinedStream.addTrack(dest.stream.getAudioTracks()[0]);
      } else if (bgmMode === 'custom' && bgmAudioEl) {
        const source = aCtx.createMediaElementSource(bgmAudioEl);
        const dest = aCtx.createMediaStreamDestination();
        source.connect(dest);
        bgmAudioEl.currentTime = 0;
        bgmAudioEl.play();
        combinedStream.addTrack(dest.stream.getAudioTracks()[0]);
      }

      let chunks = [];
      const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp9,opus' });
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      return new Promise((resolve, reject) => {
        recorder.onstop = async () => {
          if (bgmAudioEl) bgmAudioEl.pause();
          aCtx.close();

          const blob = new Blob(chunks, { type: 'video/webm' });
          const cleanTitle = document.getElementById('titleInput').value.replace(/[^a-zA-Z0-9가-힣]/g, '_');
          
          // [핵심 변경] 파일명 형식: 날짜시간_fb / 날짜시간_in / 날짜시간_us
          // 예: 20260926101530_fb_이창동_감독__가능한_사랑_.webm
          const fileName = `${timeStampStr}_${config.prefix}_${cleanTitle}.webm`;

          try {
            // 하위 폴더 없이 C:\sns_contents 바로 아래에 직접 저장
            const fileHandle = await targetFolderHandle.getFileHandle(fileName, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            resolve(fileName);
          } catch (err) {
            reject(err);
          }
        };

        recorder.start();
        let startRecTime = performance.now();

        function renderFrame(now) {
          const elapsed = now - startRecTime;
          if (elapsed >= totalDuration) {
            recorder.stop();
            return;
          }

          let accumulated = 0;
          let sceneIdx = 0;
          let sceneProgress = 0;
          for (let i = 0; i < scenes.length; i++) {
            const sceneMs = scenes[i].duration * 1000;
            if (elapsed >= accumulated && elapsed < accumulated + sceneMs) {
              sceneIdx = i;
              sceneProgress = (elapsed - accumulated) / sceneMs;
              break;
            }
            accumulated += sceneMs;
          }

          drawFrame(sceneIdx, sceneProgress, modeKey);

          document.getElementById('progressFill').style.width = ((elapsed / totalDuration) * 100) + '%';
          document.getElementById('statusText').innerText = `[${config.name}] 인코딩 중... ${(elapsed / 1000).toFixed(1)}s / ${totalSec.toFixed(1)}s`;

          requestAnimationFrame(renderFrame);
        }
        requestAnimationFrame(renderFrame);
      });
    }

    // 날짜시각 문자열 생성 (YYYYMMDDHHMMSS)
    function getFullTimestampString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${y}${m}${d}${hh}${mm}${ss}`;
    }

    // 🚀 저장하기: C:\sns_contents 선택 후 하위 폴더 없이 파일명 정렬 저장
    async function executeRender() {
      stopPreview();

      if (!rootDirHandle) {
        try {
          rootDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        } catch (err) {
          if (err.name !== 'AbortError') {
            document.getElementById('statusText').innerText = '❌ 폴더 접근 권한을 획득하지 못했습니다.';
          }
          return;
        }
      }

      const renderBtn = document.getElementById('renderBtn');
      renderBtn.disabled = true;

      try {
        const timeStampStr = getFullTimestampString();
        const targets = (exportTarget === 'all') ? ['fb', 'is', 'us'] : [exportTarget];
        
        document.getElementById('statusText').innerText = `저장 위치: ${rootDirHandle.name}\n파일 생성 및 사운드 합성 시작...`;

        const completed = [];
        for (const mode of targets) {
          const savedFile = await recordSinglePlatform(mode, rootDirHandle, timeStampStr);
          completed.push(savedFile);
        }

        document.getElementById('statusText').innerText = `🎉 완료!\n${rootDirHandle.name}에 저장되었습니다:\n${completed.join('\n')}`;
        document.getElementById('statusText').style.color = '#38bdf8';
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = '❌ 저장 실패: 폴더 쓰기 권한을 확인해주세요.';
        document.getElementById('statusText').style.color = '#ef4444';
      } finally {
        renderBtn.disabled = false;
        changeMode(currentMode);
      }
    }

    window.onload = () => {
      changeMode('us');
      renderThumbnails();
    };
  </script>
