<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SNS 멀티 포맷 비디오 생성기 (FB / IS / US)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background: #0f1015; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 460px; background: #181920; padding: 20px; overflow-y: auto; border-right: 1px solid #272832; display: flex; flex-direction: column; gap: 13px; }
    h2 { font-size: 1.15rem; color: #fff; }
    label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 500; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; background: #22232e; border: 1px solid #333547; color: #fff; padding: 9px; border-radius: 6px; font-size: 0.88rem; }
    textarea { resize: vertical; height: 90px; line-height: 1.4; }

    /* 1. 작업 기준 폴더 영역 */
    .folder-box { background: #1e2230; border: 1px solid #2e3852; padding: 12px; border-radius: 8px; }
    .folder-status { font-size: 0.82rem; color: #38bdf8; margin-top: 5px; word-break: break-all; }

    /* 프리뷰 플랫폼 탭 */
    .tab-group { display: flex; gap: 6px; background: #22232e; padding: 4px; border-radius: 8px; border: 1px solid #333547; }
    .tab-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #ff0055; color: #fff; }

    .file-box { border: 2px dashed #3b3e54; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; background: #22232e; }
    .file-box:hover { border-color: #ff0055; }

    /* 썸네일 드래그 앤 드롭 영역 */
    .thumb-container { display: flex; gap: 8px; overflow-x: auto; padding: 8px 4px; min-height: 90px; border: 1px solid #282a38; border-radius: 6px; background: #1a1b24; }
    .thumb-card {
      width: 74px; height: 74px; flex-shrink: 0; border-radius: 6px; overflow: hidden; position: relative;
      background: #000; border: 2px solid #3b3f54; cursor: grab; user-select: none;
    }
    .thumb-card.dragging { opacity: 0.35; border-color: #ff0055; }
    .thumb-card img, .thumb-card video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .thumb-badge { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
    .thumb-del { position: absolute; top: 2px; right: 2px; background: rgba(255,0,0,0.85); color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 0.7rem; line-height: 15px; text-align: center; cursor: pointer; }
    .thumb-type { position: absolute; bottom: 2px; right: 2px; background: #ff0055; color: #fff; font-size: 0.6rem; padding: 1px 3px; border-radius: 2px; font-weight: bold; }

    /* 저장 플랫폼 타겟 선택 버튼 (기본: All) */
    .target-group { display: flex; gap: 6px; }
    .target-btn { flex: 1; padding: 8px 0; background: #20222c; border: 1px solid #3b3f54; border-radius: 6px; color: #cbd5e1; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; }
    .target-btn.active { background: #38bdf8; color: #000; border-color: #38bdf8; }

    .btn-group { display: flex; gap: 8px; }
    button.action-btn { cursor: pointer; border: none; border-radius: 6px; padding: 11px 14px; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
    .btn-dir { background: #334155; color: #f1f5f9; width: 100%; }
    .btn-dir:hover { background: #475569; }
    .btn-preview { background: #3b82f6; color: #fff; flex: 1; }
    .btn-preview:hover { background: #2563eb; }
    .btn-stop { background: #2d303e; color: #eee; }
    
    .btn-render-all { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; width: 100%; font-size: 0.95rem; padding: 13px; border-radius: 8px; box-shadow: 0 4px 15px rgba(255,0,85,0.3); }
    .btn-render-all:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }

    /* 프리뷰 뷰포트 영역 */
    #preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; background: #08090c; }
    .monitor-container {
      display: flex; align-items: center; justify-content: center; background: #000; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 4px #222430; position: relative; overflow: hidden;
      transition: width 0.3s, height 0.3s;
    }
    
    .view-us { width: 320px; height: 568px; } /* 9:16 유튜브 쇼츠 */
    .view-is { width: 440px; height: 440px; } /* 1:1 인스타그램 피드 */
    .view-fb { width: 360px; height: 450px; } /* 4:5 페이스북 피드 */

    canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
    .status-bar { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; text-align: center; }
    .progress-bar { width: 360px; height: 6px; background: #1e2230; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { width: 0%; height: 100%; background: #ff0055; transition: width 0.1s; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>🎬 SNS 멀티 포맷 생성기</h2>
    
    <!-- 1. 기준 디렉토리 지정 (C:\sns_contents) -->
    <div class="folder-box">
      <label style="color:#38bdf8; font-weight:bold;">📁 1. 기준 디렉토리 지정 (C:\sns_contents)</label>
      <button type="button" class="action-btn btn-dir" onclick="selectRootDirectory()">폴더 선택하기</button>
      <div id="folderStatus" class="folder-status">선택 안 됨 (C:\sns_contents 선택)</div>
    </div>

    <!-- 미리보기 화면 비율 탭 -->
    <div>
      <label>프리뷰 플랫폼 선택</label>
      <div class="tab-group">
        <button class="tab-btn active" id="tab-us" onclick="changeMode('us')">쇼츠 (9:16)</button>
        <button class="tab-btn" id="tab-is" onclick="changeMode('is')">인스타 (1:1)</button>
        <button class="tab-btn" id="tab-fb" onclick="changeMode('fb')">페이스북 (4:5)</button>
      </div>
    </div>

    <div>
      <label>콘텐츠 메인 제목</label>
      <input type="text" id="titleInput" value="이창동 감독 '가능한 사랑'">
    </div>

    <div>
      <label>기사 및 리뷰 글 (자동 분할)</label>
      <textarea id="articleInput">이창동 감독의 신작 '가능한 사랑'은 삶의 균열 속에서 피어나는 사랑의 본질을 묻는다.
치밀한 심리 묘사와 배우들의 강렬한 연기가 숨 막히는 긴장감을 선사한다.
일상의 작은 틈새를 파고드는 날카로운 시선은 깊은 여운을 남긴다.
감독 특유의 리얼리즘과 인간에 대한 깊은 연민이 스크린 가득 펼쳐진다.
질문은 무겁고 울림은 길다. 극장에서 반드시 확인해야 할 올해의 수작이다.</textarea>
    </div>

    <!-- [검증된 알고리즘 복원] 목/머리 잘림 방지 구도 맞춤 방식 -->
    <div>
      <label style="color:#f43f5e; font-weight:bold;">🖼️ 이미지 구도 맞춤 방식</label>
      <select id="fitModeSelect" onchange="drawFrame(0, 0, currentMode)">
        <option value="contain_blur" selected>전체 화면 보존 (팔/머리 100% 노출 + 여백 블러)</option>
        <option value="smart_top">인물 상단 우선 (머리/얼굴 안 잘리게)</option>
        <option value="cover_center">기존 중앙 꽉 채우기 (배경/풍경 사진용)</option>
      </select>
    </div>

    <!-- 스틸컷 & 영상 순서 배치 (드래그 앤 드롭) -->
    <div>
      <label>스틸컷 & 영상 (드래그하여 순서 변경)</label>
      <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display: none;">
      <div class="file-box" onclick="document.getElementById('mediaInput').click()">
        + 클릭하여 사진이나 동영상 추가
      </div>
      <div id="thumbList" class="thumb-container" style="margin-top: 6px;"></div>
    </div>

    <!-- 동영상 앞부분 최대 사용 시간(초) 트리밍 -->
    <div style="display:flex; gap:10px; align-items:center; background:#20222c; padding:8px 10px; border-radius:6px;">
      <label style="margin:0; font-size:0.8rem; color:#aaa; flex:1;">동영상 앞부분 최대 사용 시간(초):</label>
      <input type="number" id="videoMaxSec" value="10" min="1" max="60" style="width:70px; padding:4px 8px;">
    </div>

    <!-- 배경음악 설정 -->
    <div>
      <label>배경음악 (오디오)</label>
      <select id="bgmModeSelect" onchange="toggleBgmInput()">
        <option value="synth" selected>기본 잔잔한 앰비언트 BGM (자동 생성)</option>
        <option value="custom">내 MP3 파일 직접 선택</option>
        <option value="none">무음</option>
      </select>
      <input type="file" id="bgmFileInput" accept="audio/*" style="display:none; margin-top:6px;">
    </div>

    <div>
      <label>장면당 표시 시간 (초)</label>
      <input type="number" id="durationInput" value="3.5" min="1" max="10" step="0.5">
    </div>

    <div class="btn-group">
      <button class="action-btn btn-preview" onclick="startPreview()">▶ 미리보기</button>
      <button class="action-btn btn-stop" onclick="stopPreview()">■ 정지</button>
    </div>

    <!-- 저장할 플랫폼 선택 (FB / IS / 쇼츠 / All, 디폴트: All) -->
    <div>
      <label>저장할 플랫폼 선택</label>
      <div class="target-group">
        <button type="button" class="target-btn active" id="tgt-all" onclick="setExportTarget('all')">All (3종 전체)</button>
        <button type="button" class="target-btn" id="tgt-fb" onclick="setExportTarget('fb')">FB (페이스북)</button>
        <button type="button" class="target-btn" id="tgt-is" onclick="setExportTarget('is')">IS (인스타)</button>
        <button type="button" class="target-btn" id="tgt-us" onclick="setExportTarget('us')">쇼츠 (US)</button>
      </div>
    </div>

    <!-- C:\sns_contents\[제목]_[날짜] 폴더 자동 생성 및 저장 버튼 -->
    <button id="renderBtn" class="action-btn btn-render-all" onclick="executeRender()">🚀 [콘텐츠제목_날짜] 폴더 자동 생성 및 저장</button>
  </div>

  <div id="preview-area">
    <div id="monitor" class="monitor-container view-us">
      <canvas id="videoCanvas" width="1080" height="1920"></canvas>
    </div>
    <div class="status-bar" id="statusText">대기 중...</div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <script>
    const PLATFORMS = {
      us: { name: '유튜브쇼츠', prefix: 'us_', width: 1080, height: 1920, className: 'view-us' },
      is: { name: '인스타그램', prefix: 'is_', width: 1080, height: 1080, className: 'view-is' },
      fb: { name: '페이스북',   prefix: 'fb_', width: 1080, height: 1350, className: 'view-fb' }
    };

    let currentMode = 'us';
    let exportTarget = 'all'; // 기본값: All
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const monitor = document.getElementById('monitor');

    let loadedMedia = [];
    let isPlaying = false;
    let animId = null;
    let rootDirHandle = null;
    let bgmAudioEl = null;

    // 1. 기준 디렉토리 (C:\sns_contents) 선택
    async function selectRootDirectory() {
      try {
        rootDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('folderStatus').innerText = `연동됨: [${rootDirHandle.name}] 하위에 폴더 자동 생성`;
        document.getElementById('folderStatus').style.color = '#38bdf8';
      } catch (err) {
        if (err.name !== 'AbortError') alert('폴더 접근 권한을 획득하지 못했습니다.');
      }
    }

    function changeMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${mode}`).classList.add('active');

      monitor.className = `monitor-container ${PLATFORMS[mode].className}`;
      canvas.width = PLATFORMS[mode].width;
      canvas.height = PLATFORMS[mode].height;
      drawFrame(0, 0, currentMode);
    }

    function setExportTarget(target) {
      exportTarget = target;
      document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tgt-${target}`).classList.add('active');

      const renderBtn = document.getElementById('renderBtn');
      if (target === 'all') {
        renderBtn.innerText = '🚀 [콘텐츠제목_날짜] 폴더에 3종 일괄 생성 및 저장';
      } else {
        renderBtn.innerText = `🚀 [콘텐츠제목_날짜] 폴더에 ${PLATFORMS[target].name} 단독 생성 및 저장`;
      }
    }

    function toggleBgmInput() {
      const mode = document.getElementById('bgmModeSelect').value;
      document.getElementById('bgmFileInput').style.display = (mode === 'custom') ? 'block' : 'none';
    }

    document.getElementById('bgmFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) bgmAudioEl = new Audio(URL.createObjectURL(file));
    });

    // 2. 미디어 파일 로드 & 썸네일
    document.getElementById('mediaInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        const item = { id: Date.now() + Math.random() };
        if (file.type.startsWith('image/')) {
          const img = new Image();
          img.src = url;
          item.type = 'image';
          item.element = img;
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = url;
          vid.muted = true;
          vid.playsInline = true;
          vid.loop = true;
          item.type = 'video';
          item.element = vid;
        }
        loadedMedia.push(item);
      });
      renderThumbnails();
      setTimeout(() => drawFrame(0, 0, currentMode), 200);
      e.target.value = "";
    });

    function renderThumbnails() {
      const container = document.getElementById('thumbList');
      container.innerHTML = "";
      if (loadedMedia.length === 0) {
        container.innerHTML = `<span style="font-size:0.75rem; color:#64748b; margin:auto;">등록된 미디어 없음 (기본 템플릿 사용)</span>`;
        return;
      }

      loadedMedia.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.draggable = true;
        card.dataset.index = index;

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.element.src;
          card.appendChild(img);
        } else {
          const vid = document.createElement('video');
          vid.src = item.element.src;
          vid.muted = true;
          card.appendChild(vid);
        }

        const badge = document.createElement('div');
        badge.className = 'thumb-badge';
        badge.innerText = `#${index + 1}`;
        card.appendChild(badge);

        const typeBadge = document.createElement('div');
        typeBadge.className = 'thumb-type';
        typeBadge.innerText = item.type === 'video' ? 'VIDEO' : 'IMG';
        card.appendChild(typeBadge);

        const delBtn = document.createElement('div');
        delBtn.className = 'thumb-del';
        delBtn.innerText = '×';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          loadedMedia.splice(index, 1);
          renderThumbnails();
          drawFrame(0, 0, currentMode);
        };
        card.appendChild(delBtn);

        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        container.appendChild(card);
      });
    }

    let dragSrcIndex = null;
    function handleDragStart(e) {
      dragSrcIndex = Number(this.dataset.index);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    function handleDrop(e) {
      e.preventDefault();
      const dropTargetIndex = Number(this.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== dropTargetIndex) {
        const movedItem = loadedMedia.splice(dragSrcIndex, 1)[0];
        loadedMedia.splice(dropTargetIndex, 0, movedItem);
        renderThumbnails();
        drawFrame(0, 0, currentMode);
      }
    }
    function handleDragEnd() {
      this.classList.remove('dragging');
      dragSrcIndex = null;
    }

    function getScenes() {
      const title = document.getElementById('titleInput').value.trim();
      const rawText = document.getElementById('articleInput').value.trim();
      const sentences = rawText.split(/\n|\.\s+/).map(s => s.trim()).filter(s => s.length > 0);
      const count = Math.max(5, loadedMedia.length || 5);
      const scenes = [];
      
      for (let i = 0; i < count; i++) {
        scenes.push({
          title: title,
          subtitle: `KEY POINT 0${i + 1}`,
          body: sentences[i] ? sentences[i] + (sentences[i].endsWith('.') ? '' : '.') : "",
          media: loadedMedia[i] || null
        });
      }
      return scenes;
    }

    // [완전 복원] 검증된 원본 smartImage 처리 함수
    function drawSmartImage(ctx, img, w, h, fitMode) {
      const nw = img.videoWidth || img.naturalWidth || w;
      const nh = img.videoHeight || img.naturalHeight || h;

      if (fitMode === 'contain_blur') {
        // 1) 배경 블러 꽉 채우기
        ctx.save();
        ctx.filter = 'blur(35px) brightness(0.4)';
        const rBg = Math.max(w / nw, h / nh);
        ctx.drawImage(img, (w - nw * rBg) / 2, (h - nh * rBg) / 2, nw * rBg, nh * rBg);
        ctx.restore();

        // 2) 전경 이미지: 비율 온전히 보존 (머리/목/팔/다리 절대 안 잘림)
        const rFg = Math.min(w / nw, h / nh);
        const fw = nw * rFg, fh = nh * rFg;
        ctx.drawImage(img, (w - fw) / 2, (h - fh) / 2, fw, fh);

      } else if (fitMode === 'smart_top') {
        // 상단 기준 정렬
        const r = Math.max(w / nw, h / nh);
        const nw2 = nw * r;
        const nh2 = nh * r;
        const cx = (w - nw2) / 2;
        const cy = Math.min(0, Math.max(h - nh2, (h * 0.12)));
        ctx.drawImage(img, cx, cy, nw2, nh2);

      } else {
        // 기존 중앙 꽉 채우기
        const r = Math.max(w / nw, h / nh);
        const nw2 = nw * r, nh2 = nh * r;
        ctx.drawImage(img, (w - nw2) / 2, (h - nh2) / 2, nw2, nh2);
      }
    }

    function drawFrame(sceneIdx, sceneProgress, mode) {
      const scenes = getScenes();
      const scene = scenes[sceneIdx];
      if (!scene) return;

      const W = canvas.width;
      const H = canvas.height;
      const fitMode = document.getElementById('fitModeSelect').value;

      ctx.fillStyle = "#0c0d12";
      ctx.fillRect(0, 0, W, H);

      // 1. 미디어 그리기 (동영상 앞부분 최대 시간 트리밍)
      if (scene.media) {
        const el = scene.media.element;
        if (scene.media.type === 'video') {
          const maxSec = parseFloat(document.getElementById('videoMaxSec').value) || 10;
          const sceneDur = parseFloat(document.getElementById('durationInput').value) || 3.5;
          const targetTime = (sceneProgress * Math.min(sceneDur, maxSec)) % maxSec;
          
          if (isPlaying) {
            if (Math.abs(el.currentTime - targetTime) > 0.3) {
              el.currentTime = targetTime;
            }
            if (el.paused) el.play();
          }
        }
        drawSmartImage(ctx, el, W, H, fitMode);
      }

      // 2. 상하단 시네마틱 섀도우 그라디언트
      const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.22);
      topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
      topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, W, H * 0.22);

      const botGrad = ctx.createLinearGradient(0, H * 0.6, 0, H);
      botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      botGrad.addColorStop(0.35, 'rgba(0, 0, 0, 0.65)');
      botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, H * 0.6, W, H * 0.4);

      // 3. 상단 제목
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 44px sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 10;
      
      const topOffset = mode === 'is' ? 90 : 140;
      ctx.fillText(scene.title, W / 2, topOffset);

      ctx.fillStyle = '#FF3366';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(`── ${scene.subtitle} ──`, W / 2, topOffset + 44);

      // 4. 하단 자막
      if (scene.body) {
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 42px sans-serif';

        const bottomOffset = mode === 'is' ? H - 180 : H - 300;
        wrapText(ctx, scene.body, W / 2, bottomOffset, W - 160, 60);
      }
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      let startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, startY + (i * lineHeight));
      }
    }

    function createAmbientAudio(audioContext, totalSec) {
      const dest = audioContext.createMediaStreamDestination();
      const chords = [
        [220.00, 261.63, 329.63],
        [174.61, 220.00, 261.63],
        [261.63, 329.63, 392.00],
        [196.00, 246.94, 293.66]
      ];

      const masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0.18, audioContext.currentTime);
      masterGain.connect(dest);

      let now = audioContext.currentTime;
      let chordIdx = 0;
      while (now < audioContext.currentTime + totalSec) {
        const notes = chords[chordIdx % chords.length];
        notes.forEach(freq => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.8);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now);
          osc.stop(now + 4.0);
        });
        now += 3.5;
        chordIdx++;
      }
      return dest.stream.getAudioTracks()[0];
    }

    function startPreview() {
      stopPreview();
      isPlaying = true;
      const scenes = getScenes();
      const duration = parseFloat(document.getElementById('durationInput').value) * 1000;
      let startTime = performance.now();

      function loop(now) {
        if (!isPlaying) return;
        const elapsed = now - startTime;
        const totalDuration = duration * scenes.length;
        const currentProgress = (elapsed % totalDuration) / totalDuration;
        
        const sceneIdx = Math.floor((elapsed % totalDuration) / duration);
        const sceneProgress = ((elapsed % totalDuration) % duration) / duration;

        drawFrame(sceneIdx, sceneProgress, currentMode);

        document.getElementById('progressFill').style.width = (currentProgress * 100) + '%';
        document.getElementById('statusText').innerText = `[${PLATFORMS[currentMode].name}] 미리보기: 씬 ${sceneIdx + 1}/${scenes.length}`;

        animId = requestAnimationFrame(loop);
      }
      animId = requestAnimationFrame(loop);
    }

    function stopPreview() {
      isPlaying = false;
      if (animId) cancelAnimationFrame(animId);
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('statusText').innerText = '정지됨';
      getScenes().forEach(s => {
        if (s.media && s.media.type === 'video') {
          s.media.element.pause();
          s.media.element.currentTime = 0;
        }
      });
    }

    async function recordSinglePlatform(modeKey, targetFolderHandle) {
      const config = PLATFORMS[modeKey];
      canvas.width = config.width;
      canvas.height = config.height;
      monitor.className = `monitor-container ${config.className}`;

      const scenes = getScenes();
      const duration = parseFloat(document.getElementById('durationInput').value) * 1000;
      const totalDuration = duration * scenes.length;
      const totalSec = totalDuration / 1000;

      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([videoStream.getVideoTracks()[0]]);

      const bgmMode = document.getElementById('bgmModeSelect').value;
      const aCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (bgmMode === 'synth') {
        const audioTrack = createAmbientAudio(aCtx, totalSec + 1);
        if (audioTrack) combinedStream.addTrack(audioTrack);
      } else if (bgmMode === 'custom' && bgmAudioEl) {
        const source = aCtx.createMediaElementSource(bgmAudioEl);
        const dest = aCtx.createMediaStreamDestination();
        source.connect(dest);
        bgmAudioEl.currentTime = 0;
        bgmAudioEl.play();
        combinedStream.addTrack(dest.stream.getAudioTracks()[0]);
      }

      let chunks = [];
      const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm; codecs=vp9,opus' });
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      return new Promise((resolve, reject) => {
        recorder.onstop = async () => {
          if (bgmAudioEl) bgmAudioEl.pause();
          aCtx.close();

          const blob = new Blob(chunks, { type: 'video/webm' });
          const cleanTitle = document.getElementById('titleInput').value.replace(/[^a-zA-Z0-9가-힣]/g, '_');
          const fileName = `${config.prefix}${cleanTitle}.webm`;

          try {
            const fileHandle = await targetFolderHandle.getFileHandle(fileName, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            resolve(fileName);
          } catch (err) {
            reject(err);
          }
        };

        recorder.start();
        let startRecTime = performance.now();

        function renderFrame(now) {
          const elapsed = now - startRecTime;
          if (elapsed >= totalDuration) {
            recorder.stop();
            return;
          }
          const sceneIdx = Math.floor(elapsed / duration);
          const sceneProgress = (elapsed % duration) / duration;
          drawFrame(sceneIdx, sceneProgress, modeKey);

          document.getElementById('progressFill').style.width = ((elapsed / totalDuration) * 100) + '%';
          document.getElementById('statusText').innerText = `[${config.name}] 인코딩 중... ${(elapsed / 1000).toFixed(1)}s`;

          requestAnimationFrame(renderFrame);
        }
        requestAnimationFrame(renderFrame);
      });
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    // 🚀 [콘텐츠제목_날짜] 폴더 자동 생성 및 저장
    async function executeRender() {
      if (!rootDirHandle) {
        alert('먼저 1번 [폴더 선택하기]를 눌러 C:\\sns_contents 폴더를 지정해 주세요.');
        await selectRootDirectory();
        if (!rootDirHandle) return;
      }

      stopPreview();
      const renderBtn = document.getElementById('renderBtn');
      renderBtn.disabled = true;

      try {
        const rawTitle = document.getElementById('titleInput').value.trim();
        const cleanTitle = rawTitle.replace(/[\/:*?"<>| ]/g, '_');
        const folderName = `${cleanTitle}_${getTodayString()}`;

        // C:\sns_contents 아래에 [제목_날짜] 폴더 자동 생성
        const targetFolderHandle = await rootDirHandle.getDirectoryHandle(folderName, { create: true });
        
        // All 또는 단일 플랫폼 분기
        const targets = (exportTarget === 'all') ? ['us', 'is', 'fb'] : [exportTarget];
        document.getElementById('statusText').innerText = `폴더: ${folderName}\n(${targets.map(t => PLATFORMS[t].name).join(', ')}) 생성 시작...`;

        const completed = [];
        for (const mode of targets) {
          const savedFile = await recordSinglePlatform(mode, targetFolderHandle);
          completed.push(savedFile);
        }

        document.getElementById('statusText').innerText = `🎉 완료!\n저장위치: C:\\sns_contents\\${folderName}\n(${completed.join(', ')})`;
        document.getElementById('statusText').style.color = '#38bdf8';
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = '❌ 오류: 저장 폴더 권한 또는 인코딩 에러';
        document.getElementById('statusText').style.color = '#ef4444';
      } finally {
        renderBtn.disabled = false;
        changeMode(currentMode);
      }
    }

    window.onload = () => {
      changeMode('us');
      renderThumbnails();
    };
  </script>
